[package]
name = "framework"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
actix-files = "0.6"
serde = { version = "1.0", features = ["derive"] }
config = "0.15"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
actix-cors = "0.7"
tikv-client = "0.3"

# Per usare protobuf (TiKV usa gRPC sotto al cofano)
prost = "0.12"
tonic = { version = "0.11", features = ["tls"] }
tokio = { version = "1", features = ["full"] }
rand = "0.9.1"
